name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Match the Modal test image (modal_image.py): CPython 3.12, installed
  # from the standalone torchwright/uv.lock.  UV_LOCKED makes every sync
  # assert that lock is current (the same drift check-modal-lock guards).
  UV_PYTHON: "3.12"
  UV_LOCKED: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync dev environment
        run: uv sync
      - name: Lint
        run: make lint

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Test (CPU)
        run: make test-ci
