name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install

      # --locked: fail if torchwright/uv.lock is out of sync with pyproject.toml.
      # This repo is checked out standalone here (no umbrella workspace), so this
      # is the surface that uses the standalone lock — and the enforcement that
      # keeps it from silently drifting (it cannot be regenerated by uv from
      # inside the workspace; see the test-onnx note in pyproject.toml).
      - name: Lint with black
        run: uv run --locked black --check .

      - name: Type check with mypy
        run: uv run --locked mypy .

      # --group test-onnx pulls CPU onnxruntime so the ONNX-runtime and
      # HF-parity tests run here instead of erroring on a missing import.
      - name: Run tests with pytest
        run: uv run --locked --group test-onnx pytest tests
